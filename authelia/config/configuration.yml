access_control:
  rules:
  - domain: "auth.{{ env `DOMAIN` }}" #this should be your authentication URL
    policy: "bypass"
  - domain: ["*.{{ join `.` (slice (splitList `.` (env `DOMAIN`)) 1) }}", "*.{{ env `DOMAIN` }}", "{{ env `DOMAIN` }}"]
    policy: "bypass"
    networks:
      - "192.168.0.0/16" #bypass if connected on local network
      - "10.8.0.0/16" #bypass if connected over VPN

session:
  cookies:
  - domain: "{{ join `.` (slice (splitList `.` (env `DOMAIN`)) 1) }}" #should match whatever your root protected domain is
    name: "virgoOS_{{ index (splitList `.` (env `DOMAIN`)) 0 }}"
    authelia_url: "https://auth.{{ env `DOMAIN` }}"
...
