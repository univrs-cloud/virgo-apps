services:
  documentserver:
    image: ghcr.io/euro-office/documentserver:latest
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${SECRET}
      - THEME=euro-office
    labels:
      - "traefik.enable=true"
      - "traefik.docker.allowNonRunning=true"
      - "traefik.http.services.euro-office.loadbalancer.server.port=80"
      - "traefik.http.routers.euro-office.service=euro-office"
      - "traefik.http.routers.euro-office.rule=Host(`nextcloud.${DOMAIN}`) && PathPrefix(`/euro-office`)"
      - "traefik.http.routers.euro-office.entrypoints=https"
      - "traefik.http.routers.euro-office.tls.certresolver=${CERTRESOLVER:+${CERTRESOLVER}}"
      - "traefik.http.middlewares.euro-office-stripprefix.stripprefix.prefixes=/euro-office"
      - "traefik.http.middlewares.euro-office-location.plugin.rewriteheaders.rewrites[0].header=Location"
      - "traefik.http.middlewares.euro-office-location.plugin.rewriteheaders.rewrites[0].regex=^/(.*)$$"
      - "traefik.http.middlewares.euro-office-location.plugin.rewriteheaders.rewrites[0].replacement=/euro-office/$$1"
      - "traefik.http.routers.euro-office.middlewares=security-headers@file,euro-office-stripprefix,euro-office-location"
    networks:
      - virgo
    healthcheck:
      test: ["CMD", "curl", "http://localhost/healthcheck"]
    restart: unless-stopped

networks:
  virgo:
    external: true
