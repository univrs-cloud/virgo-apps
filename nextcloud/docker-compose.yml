services:
  nextcloud:
    image: lscr.io/linuxserver/nextcloud:latest
    environment:
      - PUID=1000
      - PGID=100
      - DOCKER_MODS=linuxserver/mods:universal-package-install|linuxserver/mods:nextcloud-notify-push|linuxserver/mods:nextcloud-memories
      - INSTALL_PACKAGES=nodejs|npm
      - NODEJS_MOD_VERSION=24
      - NC_overwriteprotocol=https
      - NC_overwrite.cli.url=https://nextcloud.${DOMAIN}
      - NC_filesystem_check_changes=1
      - NC_maintenance_window_start=1
      - NC_simpleSignUpLink.shown=0
      - NC_knowledgebaseenabled=0
      - NC_updatechecker=0
      - NC_upgrade.disable-web=1
      - NC_preview_max_x=1024
      - NC_preview_max_y=1024
      - NC_defaultapp=files
    volumes:
      - ${APP_DIR:-/messier/apps/nextcloud}/config:/config
      - ${APP_DIR:-/messier/apps/nextcloud}/data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.allowNonRunning=true"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
      - "traefik.http.routers.nextcloud.service=nextcloud"
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=https"
      - "traefik.http.routers.nextcloud.tls.certresolver=${CERTRESOLVER:+${CERTRESOLVER}}"
      - "traefik.http.routers.nextcloud.middlewares=secure-headers@file"
    networks:
      - internal
      - virgo
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: lscr.io/linuxserver/mariadb:latest
    environment:
      - PUID=1000
      - PGID=100
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=nextcloud
      - MYSQL_ROOT_PASSWORD=nextcloud
    volumes:
      - ${APP_DIR:-/messier/apps/nextcloud}/db:/config
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:latest
    environment:
      - PUID=1000
      - PGID=100
    volumes:
      - ${APP_DIR:-/messier/apps/nextcloud}/redis:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --raw ping | grep -qx PONG"]
    restart: unless-stopped

networks:
  internal:
    internal: true
  virgo:
    external: true
